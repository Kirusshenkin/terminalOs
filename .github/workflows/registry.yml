name: registry

# Публикация в реестр MCP отдельно от сборки: релиз уже существует, а этот шаг
# можно повторить, не пересобирая и не трогая ассеты.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0"
        required: true

permissions:
  contents: read
  # Реестр пускает публиковаться по OIDC-токену прогона: ни секретов
  # в репозитории, ни ручного логина.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Тег
        id: tag
        run: echo "name=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      # server.json лежит в ассетах релиза: в нём хэш того самого бандла,
      # который собрал релизный прогон, а не пересобранного заново.
      - name: server.json из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --pattern server.json --clobber
          cat server.json

      - name: Публикация
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
