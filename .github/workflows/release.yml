name: release

# Тег вида v0.1.0 — единственный триггер релиза.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Релиз, созданный токеном прогона, не поднимает событие release:published —
  # GitHub так защищается от рекурсии. Поэтому публикацию в реестр запускаем
  # явным диспатчем, а для этого нужно право писать в Actions.
  actions: write
  # Реестр MCP пускает публиковаться по OIDC-токену прогона: ни секретов
  # в репозитории, ни ручного логина.
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # Вся история: номер сборки — число коммитов, а мелкий клон его не знает.
          fetch-depth: 0

      - name: Версия из тега
        id: ver
        run: |
          SHORT="${GITHUB_REF_NAME#v}"   # 0.1.0 — то, что видит человек
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          # Номер сборки — число коммитов: он только растёт, и локальная сборка
          # с того же коммита получает тот же номер. Счётчик прогонов Actions
          # для этого не годится: он отстаёт от локальных сборок, и macOS
          # приняла бы новую версию за откат.
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Проверки
        run: swift test

      # Собирает и упаковывает тот же скрипт, что и локально: релиз, который
      # нельзя повторить у себя на машине, отлаживать нечем.
      - name: Сборка и упаковка
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.short }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: ./.github/scripts/package.sh

      # Подпись манифеста: по ней приложение решает, ставить ли обновление.
      # Ключ живёт только в секретах; на диске раннера — до конца шага.
      - name: Подпись манифеста
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf %s "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update.pem" -out dist/latest.json.sig dist/latest.json
          rm -f "$RUNNER_TEMP/update.pem"
          # Проверка встроенным в приложение ключом: релиз, который приложение
          # отвергнет, не должен уйти.
          KEY=$(grep -o '"MFk[^"]*"' Sources/PhosphorCore/UpdateManifest.swift | tr -d '"')
          printf %s "$KEY" | base64 -d | openssl ec -pubin -inform DER -out "$RUNNER_TEMP/update.pub" 2>/dev/null
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update.pub" -signature dist/latest.json.sig dist/latest.json

      - name: Проверка бандла
        run: |
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          ditto -x -k "dist/Phosphor-${{ steps.ver.outputs.short }}.zip" /tmp/verify
          # Распакованный бандл должен пройти подпись: иначе у скачавшего
          # приложение молча не откроется.
          codesign --verify --deep --strict /tmp/verify/Phosphor.app
          test -x /tmp/verify/Phosphor.app/Contents/MacOS/phosphor-mcp
          # Бандл для MCP-клиентов: манифест и исполняемый шим внутри.
          rm -rf /tmp/mcpb && mkdir -p /tmp/mcpb
          unzip -q "dist/phosphor-mcp-${{ steps.ver.outputs.short }}.mcpb" -d /tmp/mcpb
          test -x /tmp/mcpb/server/phosphor-mcp
          test -s /tmp/mcpb/manifest.json

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Phosphor ${{ steps.ver.outputs.short }}${{ startsWith(steps.ver.outputs.short, '0.') && ' (alpha)' || '' }}" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            dist/Phosphor-${{ steps.ver.outputs.short }}.zip \
            dist/Phosphor.zip \
            dist/SHA256SUMS.txt \
            dist/latest.json \
            dist/latest.json.sig \
            dist/phosphor-mcp-${{ steps.ver.outputs.short }}.mcpb \
            dist/server.json

      # Публикация в реестр MCP — отдельным прогоном, чтобы её можно было
      # повторить, не пересобирая приложение.
      - name: Реестр MCP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run registry.yml -f tag="$GITHUB_REF_NAME"
