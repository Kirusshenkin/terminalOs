included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - design
  - dist

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - reduce_into
  - sorted_first_last
  - redundant_nil_coalescing
  - toggle_bool
  - explicit_init
  - closure_spacing
  - collection_alignment
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - yoda_condition

disabled_rules:
  - todo
  # swift-format из тулчейна сам расставляет висящие запятые в многострочных
  # литералах. Держать оба инструмента и спорить с ними — бессмысленно.
  - trailing_comma
  # Data(string.utf8) не эквивалентен string.data(using:) там, где нам нужен
  # именно опциональный путь при разборе чужого ввода.
  - optional_data_string_conversion
  # Форматтер ставит открывающую скобку по своим правилам.
  - opening_brace
  - closure_parameter_position

identifier_name:
  min_length: { warning: 2 }
  max_length: { warning: 50 }
  excluded: [id, db, ok, up, io, x, y, dx, dy, a, b, to, at]

type_name:
  # ID — имя, которого требует Identifiable.
  excluded: [ID]

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true


file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

type_body_length: { warning: 300, error: 450 }
function_body_length: { warning: 50, error: 90 }
cyclomatic_complexity: { warning: 10, error: 18 }


custom_rules:
  no_print:
    name: "print вместо логгера"
    regex: '(^|[^\w.])print\('
    message: "Только Logger: через print секрет может утечь в системный лог"
    severity: warning
  unchecked_sendable:
    name: "@unchecked Sendable"
    regex: '^\s*(final\s+)?class[^\n]*@unchecked\s+Sendable'
    message: "Каждый @unchecked Sendable — с комментарием, почему это безопасно"
    severity: warning
  no_sleep_poll:
    name: "ожидание готовности таймером"
    # Ловим именно «поспать и считать, что готово»: пауза внутри цикла опроса
    # без последующей проверки факта. Пауза в анимации или в бэкоффе — законна.
    regex: 'while[^\n]*\{[^}]*Task\.sleep\([^)]*\)[^}]*\}(?![^}]*canConnect)'
    message: "Готовность проверяем фактом соединения, а не таймером — §5.2 плана"
    severity: warning
