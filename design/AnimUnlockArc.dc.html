<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    a { color: #5BE87F; } a:hover { color: #9DF7B4; }
    .scan { background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,.34) 0 1px, transparent 1px 3px); }
    .vig { background: radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0,0,0,.75) 100%); }

    @keyframes bArc   { 0%, 8% { stroke-dashoffset: 314; opacity: .9 } 40% { stroke-dashoffset: 0; opacity: 1 } 46% { opacity: 0 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes bPop   { 0%, 40% { transform: scale(1) } 44% { transform: scale(.9) } 49% { transform: scale(1.12) } 58%, 100% { transform: scale(1) } }
    @keyframes bFlash { 0%, 41% { opacity: 0 } 46% { opacity: .9 } 60%, 100% { opacity: 0 } }
    @keyframes bFp    { 0%, 8% { opacity: .3 } 40% { opacity: 1 } 45%, 100% { opacity: 0 } }
    @keyframes bTick  { 0%, 46% { opacity: 0; transform: scale(.6) } 56%, 86% { opacity: 1; transform: scale(1) } 94%, 100% { opacity: 0; transform: scale(.6) } }
    @keyframes bRead  { 0%, 8% { opacity: 1 } 44%, 100% { opacity: 0 } }
    @keyframes bOk2   { 0%, 48% { opacity: 0 } 58%, 86% { opacity: 1 } 94%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>

<div style="width: 620px; height: 460px; background: #05080A; color: #5BE87F; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; font-size: 12px;">
  <div style="display: flex; align-items: baseline; gap: 10px;">
    <div style="font-size: 15px; color: #9DF7B4;">B · Дуга проверки</div>
    <div style="color: #2E7A45;">новый отпечаток</div>
  </div>
  <div style="color: #3E9E5A; margin: 7px 0 13px; line-height: 1.55;">Тот же тайминг, новый глиф: петлевой узор из шести гребней с разрывами и ядром, как на настоящем отпечатке, тонкая линия вместо трёх толстых дуг.</div>
  <div style="flex-grow: 1; background: #071008; border-radius: 14px; position: relative; overflow: hidden; box-shadow: inset 0 0 60px rgba(0,0,0,.85);">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;">
      <div style="position: relative; width: 124px; height: 124px; animation: bPop 4s cubic-bezier(.16,1,.3,1) infinite;">
        <svg width="124" height="124" viewBox="0 0 124 124" fill="none" style="position: absolute; inset: 0; transform: rotate(-90deg);">
          <circle cx="62" cy="62" r="50" stroke="#2E7A45" stroke-width="2" opacity=".28"/>
          <circle cx="62" cy="62" r="50" stroke="#5BE87F" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" style="animation: bArc 4s cubic-bezier(.3,0,.2,1) infinite;"/>
        </svg>
        <div style="position: absolute; inset: -6px; border: 2px solid #EAFFF0; border-radius: 50%; animation: bFlash 4s ease infinite;"></div>
        <svg width="84" height="84" viewBox="0 0 100 100" fill="none" stroke="#5BE87F" stroke-width="2.1" stroke-linecap="round" style="position: absolute; left: 20px; top: 20px; animation: bFp 4s ease infinite;"><path d="M46 58 L46 55 A4 5 0 1 1 54 55 L54 60"/><path d="M39 69 L39 54 A11 12.3 0 1 1 61 54 L61 65"/><path d="M32 76 L32 54 A18 20.2 0 1 1 68 54 L68 60"/><path d="M68 65 L68 72"/><path d="M25 81 L25 54 A25 28.0 0 1 1 75 54 L75 78"/><path d="M18 78 L18 69"/><path d="M18 63 L18 54 A32 35.8 0 1 1 82 54 L82 82"/><path d="M11 70 L11 54 A39 43.7 0 1 1 89 54 L89 75"/><path d="M4 60 L4 54 A46 50 0 0 1 22 14"/><path d="M96 62 L96 54 A46 50 0 0 0 80 15"/></svg>
        <svg width="84" height="84" viewBox="0 0 84 84" fill="none" stroke="#9DF7B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 20px; top: 20px; animation: bTick 4s cubic-bezier(.16,1,.3,1) infinite;"><path d="M29 43 L38 52 L56 32"/></svg>
      </div>
      <div style="position: relative; height: 22px; width: 280px; text-align: center;">
        <div style="position: absolute; inset: 0; font-size: 14px; color: #3E9E5A; animation: bRead 4s ease infinite;">читаю отпечаток</div>
        <div style="position: absolute; inset: 0; font-size: 14px; color: #9DF7B4; animation: bOk2 4s ease infinite;">открыто</div>
      </div>
    </div>

    <div class="scan" style="position: absolute; inset: 0; pointer-events: none;"></div>
    <div class="vig" style="position: absolute; inset: 0; pointer-events: none;"></div>
  </div>
  <div style="display: flex; gap: 18px; color: #2E7A45; margin-top: 12px; font-size: 11px;"><span>чтение 1,3 с</span><span>щелчок 200 мс</span><span>stroke-dashoffset + transform</span></div>
</div>

</x-dc>

class Component extends DCLogic {}
</script>

</html>
