<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    a { color: #5BE87F; } a:hover { color: #9DF7B4; }
    .scan { background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,.34) 0 1px, transparent 1px 3px); }
    .replay:hover { border-color: #5BE87F; color: #5BE87F; }
    @keyframes scanA { from { transform: translateY(-10px) } to { transform: translateY(330px) } }
    @keyframes scanB { from { transform: translateY(-10px) } to { transform: translateY(330px) } }
    @keyframes wipeA { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes wipeB { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</helmet>

<div style="width: 560px; height: 400px; background: #071008; color: #9DF7B4; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; font-size: 12px;">
  <div style="display: flex; align-items: baseline; gap: 10px;">
    <div style="font-size: 15px; color: #9DF7B4; font-weight: 500;">Скан</div>
    <div style="font-size: 11px; color: #2E7A45;">≈700 мс</div>
  </div>
  <div style="font-size: 11.5px; color: #3E9E5A; margin: 7px 0 14px; line-height: 1.5;">Бирюзовая линия проходит сверху вниз, за ней проявляется интерфейс. Читается как «система просыпается и проверяет себя» — под стать панели мониторинга.</div>

  <div style="flex-grow: 1; background: #050D06; border: 1px solid rgba(91,232,127,.18); position: relative; overflow: hidden;">
    <div class="anim" style="animation: wipe{{a}} .6s ease .12s both;">
    <div style="position: absolute; inset: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 5px; align-items: center;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: rgba(91,232,127,.30);"></div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: rgba(91,232,127,.30);"></div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: rgba(91,232,127,.30);"></div>
        <div style="width: 52px; height: 6px; background: rgba(91,232,127,.18); margin-left: 8px;"></div>
        <div style="flex-grow: 1;"></div>
        <div style="width: 34px; height: 6px; background: rgba(91,232,127,.08); border: 1px solid rgba(91,232,127,.28);"></div>
      </div>
      <div style="display: flex; gap: 10px; flex-grow: 1; min-height: 0;">
        <div style="width: 92px; display: flex; flex-direction: column; gap: 6px;">
          <div style="width: 46px; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 74px; height: 5px; background: #1E5C33;"></div>
          <div style="width: 62px; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 70px; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 40px; height: 5px; background: #0E2412; margin-top: 6px;"></div>
          <div style="width: 66px; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 58px; height: 5px; background: rgba(91,232,127,.18);"></div>
        </div>
        <div style="flex-grow: 1; border-left: 1px solid rgba(91,232,127,.10); padding-left: 10px; display: flex; flex-direction: column; gap: 7px;">
          <div style="width: 78%; height: 5px; background: #1E5C33;"></div>
          <div style="width: 54%; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 66%; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 44%; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 70%; height: 5px; background: rgba(91,232,127,.18);"></div>
          <div style="width: 30%; height: 5px; background: #3E9E5A;"></div>
        </div>
      </div>
    </div>
    </div>
    <div class="anim" style="position: absolute; left: 0; right: 0; height: 1px; background: #5BE87F; box-shadow: 0 0 12px #5BE87F; animation: scan{{a}} .7s cubic-bezier(.4,0,.2,1) both;"></div>
    <div class="scan" style="position: absolute; inset: 0; pointer-events: none;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin-top: 14px;">
    <div class="replay" onClick="{{ replay }}" style="border: 1px solid rgba(91,232,127,.30); color: #3E9E5A; padding: 5px 13px; font-size: 11.5px; cursor: pointer;">Проиграть ещё раз</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 11px; color: #2E7A45;">transform: translateY + opacity</div>
  </div>
</div>

</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const run = this.state.run ?? 0;
    const s = run % 2 === 0 ? 'A' : 'B';
    return {
      a: s,
      replay: () => this.setState({ run: run + 1 }),
    };
  }
}
</script>
</body>
</html>
